name: linux

# Builds the Linux binary on every push, so it at least compiles, and attaches it to the
# release when a version tag is pushed. The macOS binary is published with scripts/release.sh.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo build --release
      - if: startsWith(github.ref, 'refs/tags/')
        run: tar -czf handsfree-x86_64-unknown-linux-gnu.tar.gz -C target/release handsfree
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: handsfree-x86_64-unknown-linux-gnu.tar.gz
